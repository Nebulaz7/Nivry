[package]
name = "nivry-integration-tests"
description = "Sandbox cross-contract and adversarial tests for the Nivry contracts."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone workspace root so this harness is never built for wasm.
[workspace]

[dev-dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
anyhow = "1"
