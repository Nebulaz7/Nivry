services:
  postgres:
    image: postgres:16-alpine
    container_name: nivry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nivry
      POSTGRES_USER: nivry
      POSTGRES_PASSWORD: nivry_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:

